name: Build Jar

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Compile Java Code
      run: |
        mkdir -p bin
        # Поиск всех .jar файлов в проекте и добавление их в classpath
        CP=$(find . -name "*.jar" | tr '\n' ':')
        javac -encoding UTF-8 -cp "$CP" -d bin $(find src -name "*.java")
        cd bin
        jar -cvf ../Expensive.jar .

    - name: Upload JAR Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Expensive-JAR
        path: Expensive.jar
